name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - name: Run backend tests and package application
        run: mvn -B --no-transfer-progress -f backend/pom.xml verify
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload application and test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hengzhang-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/target/reconciliation-center-1.0.0.jar
            backend/target/surefire-reports/
            artifacts/playwright-report/
            artifacts/test-results/
